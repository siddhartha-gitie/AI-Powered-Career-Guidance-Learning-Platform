{% extends 'base.html' %}
{% block content %}
<article>
    <header><a href="{{ url_for('career_recommender') }}" class="secondary">← Change Stage</a></header>
    <hgroup>
        <h1>Career Questionnaire</h1>
        <h2>Rate yourself on a scale of 1 to 10 for each question.</h2>
    </hgroup>
    <form method="post">
        <input type="hidden" name="stage" value="{{ stage }}">
        {% for q in questions %}
        <div class="slider-container">
            <div class="slider-label-group">
                <label for="{{ q.name }}">{{ q.text }}</label>
                <span class="permanent-value">5</span>
            </div>
            <div class="slider-wrapper">
                <input type="range" id="{{ q.name }}" name="{{ q.name }}" min="1" max="10" value="5">
            </div>
        </div>
        {% endfor %}
        <button type="submit">Get My Recommendation</button>
    </form>
</article>
{% endblock %}
